[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lawstation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "pydantic-settings>=2.5",
  "langchain>=1.3.14,<2",
  "langgraph>=1.1,<2",
  "langchain-core>=1.5.4,<2",
  "langchain-openai>=1.1,<2",
  "langchain-mcp-adapters>=0.3,<1",
  "mcp>=1.8",
  "httpx>=0.27",
  "numpy>=1.26",
  "faiss-cpu>=1.8",
  "rank-bm25>=0.2.2",
  "jieba>=0.42",
  "filelock>=3.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["backend*", "mcp_servers*"]
